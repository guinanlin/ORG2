# Standalone workflow — build ORGII Linux x64 .deb only.
#
# Uploads the .deb to GitHub Release and as a workflow artifact.
#
# Triggers:
#   - workflow_dispatch  (manual; optional release_tag — auto-generates if empty)
#   - push tag v*          (creates/updates Release for that tag)
#
# Version resolution:
#   - tag push     → version from git tag (e.g. v1.1.7 → 1.1.7)
#   - manual + tag → version from release_tag input
#   - manual, no tag → auto: {package.json}-dev.{run}.{sha} + Release v…
#
# Optional secrets:
#   ORGII_DIAGNOSTICS_TOKEN
#
# This workflow does NOT sign updater artifacts (deb-only). Updater signing
# lives in release.yaml — do not pass TAURI_SIGNING_* here.

name: "Build Linux deb"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.1.7). Leave empty to auto-generate v{package.json}-dev.{run}.{sha}."
        required: false
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux-deb:
    name: Build Linux x64 (.deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve build version
        id: version
        run: |
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
            FULL_VERSION="${RELEASE_TAG#v}"
            VERSION_SOURCE="git-tag"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
            if [[ ! "$RELEASE_TAG" =~ ^v ]]; then
              RELEASE_TAG="v${RELEASE_TAG}"
            fi
            FULL_VERSION="${RELEASE_TAG#v}"
            VERSION_SOURCE="manual-input"
          else
            BASE_VERSION=$(node -p "require('./package.json').version.replace(/[-+].*$/, '')")
            SHORT_SHA="${GITHUB_SHA:0:7}"
            FULL_VERSION="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
            RELEASE_TAG="v${FULL_VERSION}"
            VERSION_SOURCE="auto"
          fi

          if ! [[ "$FULL_VERSION" =~ $semver_re ]]; then
            echo "Invalid version '$FULL_VERSION' (source: $VERSION_SOURCE)" >&2
            exit 1
          fi

          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"
          echo "SEMVER=$FULL_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION_SOURCE=$VERSION_SOURCE" >> "$GITHUB_ENV"
          echo "source=$VERSION_SOURCE" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          sed -i "s/\"version\": \".*\"/\"version\": \"$FULL_VERSION\"/" src-tauri/tauri.conf.json
          sed -i "s/\"version\": \".*\"/\"version\": \"$FULL_VERSION\"/" package.json

          echo "=== Resolved version (source: $VERSION_SOURCE) ==="
          echo "  Release tag: $RELEASE_TAG"
          echo "  App version: $FULL_VERSION"
          grep '"version"' src-tauri/tauri.conf.json package.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "build-linux-deb-x64"

      - name: Build ORGII (.deb only)
        env:
          ORGII_DIAGNOSTICS_TOKEN: ${{ secrets.ORGII_DIAGNOSTICS_TOKEN }}
          ORGII_APP_VERSION: ${{ env.SEMVER }}
        run: |
          pnpm tauri build \
            --target x86_64-unknown-linux-gnu \
            --bundles deb \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Gather .deb artifact
        id: artifacts
        run: |
          BUNDLE_DIR="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle"
          DEB=$(find "$BUNDLE_DIR/deb" -name "*.deb" | head -1)

          if [ ! -f "$DEB" ]; then
            echo "Missing .deb artifact under $BUNDLE_DIR/deb" >&2
            exit 1
          fi

          LATEST_DEB="ORG2-latest-linux-x64.deb"
          cp "$DEB" "$LATEST_DEB"

          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "latest_deb=$LATEST_DEB" >> "$GITHUB_OUTPUT"
          echo "deb_name=$(basename "$DEB")" >> "$GITHUB_OUTPUT"

          echo "=== Linux deb artifact ==="
          ls -lh "$DEB" "$LATEST_DEB"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: org2-linux-x64-deb
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.latest_deb }}

      - name: Upload .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: ${{ steps.version.outputs.source == 'git-tag' }}
          overwrite_files: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-dev.') || contains(env.RELEASE_TAG, '-rc') || contains(env.RELEASE_TAG, '-beta') || contains(env.RELEASE_TAG, '-alpha') || contains(env.RELEASE_TAG, '-nightly') }}
          files: |
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.latest_deb }}
